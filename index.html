<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding:0;
        }
  body{
    background-color: rgb(101, 25, 78);
  color:white;
  font-family: 'poppins', sans-serif;
}
nav{
    display: flex;
    justify-content: space-around;
    align-items: center;
    height:80px;
    background-color: rgb(45, 15, 36);
}
nav ul{
    display: flex;
    justify-content: center;
}
nav ul li{
   list-style: none;
    margin:0 23px;
}
nav ul li a{
   text-decoration: none;
    color:white;
}
nav ul li a:hover{
   font-size: 1.02rem;
    color:rgb(213, 213, 247);
}
.firstsection{
    display: flex;
    justify-content: space-around;
    margin:110px 0;
    align-items: center;
}
.firstsection > div{
    width:30%;
}
.leftsection{
    font-size: 2rem;
    
    
}
.rightsection img{
    width:80%;

}
.blue{
    color:  rgb(231, 13, 166);
}
#element{
    color: rgb(231, 13, 166);
}
.secondsection{
    margin:auto;
    max-width: 80vw;
}
main hr{
    border: 0;
    background-color: rgb(171, 53, 136);
    height:1.2px;
    margin:60px 84px;
}
.secondsection h1{
    font-size: 1.6rem;
}

</head>
<body>

        <nav>
            <div class="left">Khushboo's Portfolio</div>

            <ul>

              <li><a href="/">About</a></li>

               <li><a href="/">Project</a></li>
               <li><a href="/">Contact Me</a></li>
            </ul>

    <main>
        <section class="firstsection">

           <div>and I am a passionate</div>
           
            <span id="element"></span>
            </div>
            <div class="rightsection">
       <img src="developer-png.jpeg">
            </div>
        </section>
        <hr>
        <section class="secondsection">
            <h1>Education</h1>

        </section>
    </main>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
   <!-- Setup and start animation! -->
  <script>
    var typed = new Typed('#element', {
      strings: ['Web Developer', 'Web designer'],
      typeSpeed: 50,
    });
  </script>
